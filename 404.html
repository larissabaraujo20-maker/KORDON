<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Página não encontrada · Kordon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Figtree:wght@200;300;400;500&display=swap">
<style>
  :root{
    --ink:#000; --surface:#0B0A09; --surface-2:#121110; --line:#241F19; --line-2:#383127;
    --amarelo:#F9C930; --amarelo-esc:#B8912A; --branco:#fff;
    --nevoa:#8B8577; --nevoa-claro:#CFCABD;
    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"Figtree","Helvetica Neue",Arial,sans-serif;
    --gut:clamp(22px,5.5vw,84px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--surface);
    color:var(--branco);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .nav{
    padding:28px var(--gut) 0;
    display:flex;
    align-items:center;
  }
  .nav .mark{height:34px;width:auto;display:block}
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px var(--gut);
    text-align:center;
  }
  .wrap{max-width:640px}
  .eyebrow{
    font-family:var(--display);
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:13px;
    color:var(--amarelo);
    margin:0 0 18px;
  }
  h1{
    font-family:var(--display);
    font-weight:800;
    font-size:clamp(40px,8vw,88px);
    line-height:.95;
    margin:0 0 20px;
    color:var(--branco);
  }
  p{
    font-size:clamp(16px,2vw,19px);
    line-height:1.55;
    color:var(--nevoa-claro);
    margin:0 0 34px;
    font-weight:300;
  }
  .btn{
    display:inline-block;
    font-family:var(--display);
    font-weight:700;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--ink);
    background:var(--amarelo);
    padding:16px 34px;
    border-radius:999px;
    transition:background .2s ease;
  }
  .btn:hover{background:var(--amarelo-esc)}
  footer{
    padding:24px var(--gut) 36px;
    text-align:center;
    font-size:12px;
    color:var(--nevoa);
  }
</style>
</head>
<body>
  <header class="nav">
    <img class="mark" src="img/logo.png" alt="Kordon, Share of Experience" draggable="false">
  </header>

  <main>
    <div class="wrap">
      <p class="eyebrow">Erro 404</p>
      <h1>Não basta ver.<br>Essa página não existe.</h1>
      <p>O link que você seguiu pode estar quebrado ou a página foi movida. Volte para o início e continue explorando a Kordon.</p>
      <a class="btn" href="/">Voltar para o início</a>
    </div>
  </main>

  <footer>© Kordon · São Paulo</footer>
</body>
</html>
